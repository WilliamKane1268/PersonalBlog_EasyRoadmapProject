<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Personal Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="blog-box">
    <!-- Header Admin có nút + Add -->
    <div class="header-row">
        <h1>Personal Blog</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <a th:href="@{/admin/articles/new}" style="font-size: 15px; font-weight: 800; color: #111111; text-decoration: none;">+ Add</a>
            <form th:action="@{/logout}" method="post" style="display: inline; margin: 0;">
                <button type="submit" class="btn-sketch" style="padding: 3px 8px; font-size: 12px;">Logout</button>
            </form>
        </div>
    </div>

    <!-- Nếu rỗng -->
    <div th:if="${#lists.isEmpty(articles)}">
        <p style="color: #8b95a5; font-size: 14px;">No articles yet. Click "+ Add" to create one.</p>
    </div>

    <!-- Danh sách: Tên bài bên trái, Edit / Delete bên phải -->
    <div class="article-row" th:each="article : ${articles}">
        <span class="article-row-title" th:text="${article.title}">Title article</span>

        <div class="admin-actions">
            <a th:href="@{/admin/articles/{id}/edit(id=${article.id})}">Edit</a>
            <form th:action="@{/admin/articles/{id}/delete(id=${article.id})}" method="post" style="display:inline;">
                <button type="submit" onclick="return confirm('Are you sure you want to delete this article?');">Delete</button>
            </form>
        </div>
    </div>

    <!-- Link quay lại trang chủ khách -->
    <div style="margin-top: 24px; border-top: 1px dashed #ccc; padding-top: 12px;">
        <a th:href="@{/home}" style="font-size: 13px; color: #8b95a5; text-decoration: none;">← View Home</a>
    </div>
</div>

</body>
</html>
