<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Personal Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="blog-box">
    <!-- Thanh tiêu đề -->
    <div class="header-row">
        <h1>Personal Blog</h1>
        <a th:href="@{/admin/dashboard}" style="font-size: 13px; color: #8b95a5; text-decoration: none;">Admin</a>
    </div>

    <!-- Thông báo nếu chưa có bài -->
    <div th:if="${#lists.isEmpty(articles)}">
        <p style="color: #8b95a5; font-size: 14px;">No articles published yet.</p>
    </div>

    <!-- Danh sách bài viết 2 cột: Tiêu đề bên trái, Ngày đăng bên phải -->
    <div class="article-row" th:each="article : ${articles}">
        <a class="article-row-title"
           th:href="@{/article/{id}(id=${article.id})}"
           th:text="${article.title}">First article title</a>

        <span class="article-row-date"
              th:text="${#temporals.format(article.publishedDate, 'MMMM d, yyyy')}">August 7, 2024</span>
    </div>
</div>

</body>
</html>
